<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal sentiment analysis concept graphic</title>
  <desc id="desc">A video clip is analyzed through text, audio, and vision signals, then fused by a transformer model to predict sentiment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#fff8ec"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fuse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="175" cy="125" r="92" fill="#dbeafe" opacity="0.65"/>
  <circle cx="1435" cy="760" r="125" fill="#fed7aa" opacity="0.45"/>
  <path d="M102 773 C282 648 372 824 542 718 C724 604 823 720 980 632 C1131 548 1269 574 1465 474" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

  <text x="80" y="94" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">Problem Definition</text>
  <text x="80" y="146" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#475569">Predict sentiment from what is said, how it sounds, and how it looks.</text>

  <g filter="url(#shadow)">
    <rect x="95" y="240" width="420" height="310" rx="34" fill="url(#screen)"/>
    <rect x="126" y="274" width="358" height="206" rx="22" fill="#e0f2fe"/>
    <path d="M306 328 C340 328 367 355 367 389 C367 423 340 450 306 450 C272 450 245 423 245 389 C245 355 272 328 306 328 Z" fill="#f6c28b"/>
    <path d="M247 370 C262 326 296 303 341 321 C353 326 362 335 368 347 C341 337 300 337 247 370 Z" fill="#263238"/>
    <path d="M280 389 C286 396 296 398 306 398 C318 398 327 395 333 389" fill="none" stroke="#7c2d12" stroke-width="5" stroke-linecap="round"/>
    <circle cx="284" cy="375" r="5" fill="#111827"/>
    <circle cx="329" cy="375" r="5" fill="#111827"/>
    <path d="M214 313 L174 313 C154 313 138 329 138 349 L138 375 C138 394 154 410 174 410 L206 410 L230 438 L224 410 L252 410 C272 410 288 394 288 375 L288 349 C288 329 272 313 252 313 Z" fill="#ffffff"/>
    <text x="158" y="352" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#0f172a">“That was</text>
    <text x="167" y="382" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#0f172a">great...”</text>
    <path d="M140 515 L470 515" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="220" cy="515" r="12" fill="#22c55e"/>
    <text x="173" y="590" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Input Video Clip</text>
  </g>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="635" y="210" width="350" height="115" rx="28" fill="#ffffff"/>
    <circle cx="690" cy="267" r="33" fill="#dbeafe"/>
    <text x="681" y="279" font-size="34" font-weight="900" fill="#2563eb">T</text>
    <text x="742" y="255" font-size="28" font-weight="800" fill="#0f172a">Text</text>
    <text x="742" y="288" font-size="20" font-weight="500" fill="#64748b">spoken words</text>

    <rect x="635" y="390" width="350" height="115" rx="28" fill="#ffffff"/>
    <circle cx="690" cy="447" r="33" fill="#dcfce7"/>
    <path d="M668 447 C679 426 697 426 708 447 C697 468 679 468 668 447 Z" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
    <path d="M726 430 C737 441 737 453 726 464" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <text x="742" y="435" font-size="28" font-weight="800" fill="#0f172a">Audio</text>
    <text x="742" y="468" font-size="20" font-weight="500" fill="#64748b">tone and rhythm</text>

    <rect x="635" y="570" width="350" height="115" rx="28" fill="#ffffff"/>
    <circle cx="690" cy="627" r="33" fill="#ffedd5"/>
    <path d="M666 620 Q690 599 714 620" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    <path d="M671 641 Q690 655 709 641" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="679" cy="627" r="4" fill="#ea580c"/>
    <circle cx="702" cy="627" r="4" fill="#ea580c"/>
    <text x="742" y="615" font-size="28" font-weight="800" fill="#0f172a">Vision</text>
    <text x="742" y="648" font-size="20" font-weight="500" fill="#64748b">face and gesture</text>
  </g>

  <path d="M520 395 C575 320 590 273 625 267" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M520 395 C584 395 596 447 625 447" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M520 395 C575 510 590 621 625 627" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1115" y="318" width="310" height="210" rx="36" fill="url(#fuse)"/>
    <text x="1270" y="377" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="29" font-weight="900" text-anchor="middle" fill="#ffffff">Transformer Fusion</text>
    <text x="1270" y="419" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#dbeafe">combine signals</text>
    <g opacity="0.92">
      <circle cx="1212" cy="474" r="13" fill="#ffffff"/>
      <circle cx="1270" cy="474" r="13" fill="#ffffff"/>
      <circle cx="1328" cy="474" r="13" fill="#ffffff"/>
      <path d="M1224 474 L1257 474 M1283 474 L1315 474 M1218 462 L1261 430 M1279 430 L1322 462" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M992 267 C1052 285 1069 338 1102 385" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M992 447 L1102 424" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M992 627 C1052 602 1070 520 1102 463" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1165" y="645" width="365" height="128" rx="32" fill="#ffffff"/>
    <text x="1348" y="690" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="#0f172a">Predicted Sentiment</text>
    <rect x="1243" y="713" width="210" height="42" rx="21" fill="#fee2e2"/>
    <text x="1348" y="742" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#b91c1c">Negative</text>
  </g>
  <path d="M1270 535 L1328 634" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <rect x="80" y="710" width="790" height="94" rx="28" fill="#ffffff" opacity="0.88"/>
    <text x="112" y="753" font-size="25" font-weight="900" fill="#0f172a">Key idea:</text>
    <text x="232" y="753" font-size="25" font-weight="600" fill="#334155">words can be misleading unless we also read voice and face.</text>
    <text x="112" y="787" font-size="21" font-weight="500" fill="#64748b">Example: positive words + sarcastic tone + annoyed expression may indicate negative sentiment.</text>
  </g>
</svg>
